name: Build Inte en chatt APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/not-a-chat-standalone
    paths:
      - 'not-a-chat/**'
      - '.github/workflows/not-a-chat.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build standalone APK
        run: gradle --no-daemon -p not-a-chat assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Inte-en-chatt-debug-apk
          path: not-a-chat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
