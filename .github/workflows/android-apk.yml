name: Build UnApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/character-studio
      - feature/llama-cpp-engine
      - feature/offline-image-generation
      - feature/testchatt-long-term-memory
      - feature/testchat-character-selection
      - feature/unified-chat-character-profiles
  pull_request:
    branches:
      - main
      - feature/testchatt-long-term-memory
      - feature/character-studio
      - feature/appforge-visual-shell-preview
      - fix/expand-chat-history

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: e637c7bccd35aa8841d67fb942ba72918176826c
          path: app/src/main/cpp/third_party/stable-diffusion.cpp
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

